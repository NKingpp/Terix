services:
  artex:
    # 安全约束：禁止使用任何外部预构建镜像（已确认存在后门）。
    # 只从本仓库源码构建；pull_policy: never 阻止 Compose 向镜像仓库拉取。
    # 构建前需准备 dist/${TARGETARCH}/artex，见 README「部署说明」第 4 节。
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    pull_policy: never
    image: terix:${TERIX_TAG:-latest}
    container_name: Terix
    environment:
      # SQLite 库文件位于挂载进来的 /app/data 下，容器重建不丢。
      # 不写这个变量也可以（默认就是 /app/data/quantex.db，见 config.DBPath）。
      ARTEX_DB_PATH: /app/data/quantex.db
      # akshare sidecar 现在跑在**同一个容器**里（由 start.sh 拉起），
      # 所以这里是 127.0.0.1 —— 不再是服务名。
      #
      # # 合并部署消掉了原来那个坑
      #
      # 分离部署时这个变量在 Go 侧是「目标地址」、在 sidecar 侧是「监听地址」，
      # 同名反义，必须写成两个不同的值（akshare:8791 / 0.0.0.0:8791）。
      # 配错的表现是全部 SIDECAR_UNREACHABLE，而错误只在运行时暴露。
      AKSHARE_SIDECAR_ADDR: 127.0.0.1:8791
      # start.sh 读这个决定 bind 哪里；必须与上面是同一个端口。
      AKSHARE_LISTEN_ADDR: 127.0.0.1:8791
      TZ: Asia/Shanghai
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      # sidecar 已合并，只暴露 artex 自己的两个端口。
      # 8791 不再映射：它是容器内的回环地址，宿主无需直连；
      # 要排查就用 docker exec Terix curl 127.0.0.1:8791/health。
      - "8797:8787"
      - "127.0.0.1:8798:8788"
    volumes:
      # 把数据目录（含 jwt.key、quantex.db 及其 WAL 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
      # okx CLI 的 ~/.okx（config.toml / 缓存）持久化
      - ./okx-config:/root/.okx
    healthcheck:
      # 两个条件都满足才算健康：artex 起来 + sidecar 预热完成。
      # 只看 artex 端口通是不够的 —— 那时非加密行情仍不可用，
      # 容器却是绿的，问题只能靠跑任务时偶发报错发现。
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://127.0.0.1:8787/api/health >/dev/null &&
          python -c "import json,urllib.request,sys;
          d=json.load(urllib.request.urlopen('http://127.0.0.1:8791/health'));
          sys.exit(0 if d.get('data',{}).get('warmup_done') else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      # 首次 import akshare + 预热要几十秒，给足窗口，否则会被反复重启。
      start_period: 150s
    restart: unless-stopped
